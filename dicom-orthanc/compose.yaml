services:
  orthanc:
    image: orthancteam/orthanc:latest
    container_name: armc-orthanc
    restart: "no"

    ports:
      - "127.0.0.1:8042:8042"
      - "127.0.0.1:4242:4242"

    environment:
      ORTHANC__NAME: "ARMC Orthanc PACS"
      ORTHANC__DICOM_AET: "ARMC_PACS"
      ORTHANC__DICOM_PORT: "4242"
      ORTHANC__REMOTE_ACCESS_ALLOWED: "true"
      ORTHANC__AUTHENTICATION_ENABLED: "false"

    volumes:
      - armc_orthanc_storage:/var/lib/orthanc/db

volumes:
  armc_orthanc_storage:
